    - https://epg.pw/xmltv/epg_DO.xml
    - https://www.epgshare01.online/epg/epgshare01.xml.gz
    - https://epg.pw/xmltv/epg_ES.xml
    - https://epg.pw/xmltv/epg_MX.xml
    - https://epg.pw/xmltv/epg_CO.xml

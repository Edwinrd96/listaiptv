name: IPTV auto-mantenimiento
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    paths: ["channels.yaml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Validar canales
        run: python iptv.py check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python iptv.py build
      - run: python iptv.py epg
      - name: Publicar
        run: |
          git config user.name "iptv-bot"; git config user.email "bot@users.noreply.github.com"
          git add dist state.json channels.yaml
          git diff --cached --quiet || (git commit -m "auto: lista actualizada" && git push)
